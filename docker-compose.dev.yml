services:
    # 1. Standard Infrastructure
    mongodb:
        image: mongo:6.0
        container_name: old-dev-mongo
        ports:
            - "27017:27017"
        volumes:
            - mongo_data:/data/db
        networks:
            old-network:
                ipv4_address: 172.5.5.2
        environment:
            - MONGO_INITDB_DATABASE=lowcoder

    redis:
        image: redis:7-alpine
        container_name: old-dev-redis
        ports:
            - "6379:6379"
        networks:
            old-network:
                ipv4_address: 172.5.5.3

    # 2. Java Backend API Server (Mounts local folder and runs Maven live compilation)
    api-service:
        image: maven:3.8.5-openjdk-17
        container_name: old-dev-api
        working_dir: /app/server/api-service
        ports:
            - "8090:8080"
        volumes:
            - .:/app # Mount whole root workspace
            - ~/.m2:/root/.m2 # Cache dependencies on your Debian host
        depends_on:
            - mongodb
            - redis
        networks:
            old-network:
                ipv4_address: 172.5.5.4
        environment:
            - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/lowcoder
            - SPRING_DATA_REDIS_HOST=redis
            - LOWCODER_EMAIL_SIGNUP_ENABLED=true  # Вмикає саму форму
            - LOWCODER_EMAIL_AUTH_ENABLED=true        # Додатковий прапорець для старіших гілок коду
            - MAVEN_OPTS=-XX:+AllowRedefinitionToAddDeleteMethods --add-opens java.base/java.nio=ALL-UNNAMED
        entrypoint: bash -c "cd /app/server/api-service && mvn clean package -DskipTests -q && java -Dpf4j.mode=development -Dspring.profiles.active=default -Dpf4j.pluginsDir=/app/server/api-service/lowcoder-plugins -XX:+AllowRedefinitionToAddDeleteMethods --add-opens java.base/java.nio=ALL-UNNAMED -cp lowcoder-server/target/lowcoder-api-service-bin/lowcoder-api-service.jar:lowcoder-server/target/lowcoder-api-service-bin/libs/* org.lowcoder.api.ServerApplication"

    # 3. Node.js Code Execution Microservice
    node-service:
        image: node:18-bullseye
        container_name: old-dev-node
        working_dir: /app
        ports:
            - "8081:8081"
        environment:
            - LOWCODER_API_SERVICE_URL=http://api-service:8080
            - NODE_OPTIONS=--openssl-legacy-provider # Resolves Debian 13 strict OpenSSL 3 behavior
        volumes:
            - .:/app # Mount root to allow workspace package resolutions
        entrypoint: bash -c "sleep 120 && cd server/node-service && yarn install && yarn dev"
        depends_on:
            - api-service
        networks:
            old-network:
                ipv4_address: 172.5.5.5
    # 4. React Frontend Client
    frontend:
        image: node:18-bullseye
        container_name: old-dev-frontend
        working_dir: /app/client
        ports:
            - "3000:8000"
        environment:
            - LOWCODER_API_SERVICE_URL=http://localhost:8080
            - WDS_SOCKET_PORT=3000
            - BROWSER=none # ЗАБОРОНЯЄ Vite шукати xdg-open всередині контейнера
            # Браузер на вашому Debian має йти на localhost:8090 (зовнішній порт вашого api-service)
            - REACT_APP_API_BASE_URL=http://localhost:8090
            - REACT_APP_API_SERVICE_URL=http://localhost:8090
            
            # Для нових версій на Vite (про всяк випадок дублюємо, оскільки Vite ігнорує REACT_APP_)
            - VITE_API_SERVICE_URL=http://localhost:8090
            
            # Node-service прокинуто на порт 8081, тому браузер теж шукатиме його на localhost
            - REACT_APP_NODE_SERVICE_URL=http://localhost:8081
            - VITE_NODE_SERVICE_URL=http://localhost:8081
        volumes:
            - .:/app # Mount root workspace
            - /app/client/node_modules # Do not let host node_modules clash with container architecture
        entrypoint: bash -c "sleep 150 && yarn install && yarn start --host 0.0.0.0 --port 8000"
        depends_on:
            - api-service
        networks:
            old-network:
                ipv4_address: 172.5.5.6

volumes:
    mongo_data:
networks:
    old-network: # OpenLotus Designer Development Network
        name: "openlotusdesigner_network"
        driver: bridge
        ipam:
            config:
                - subnet: 172.5.5.0/24
                  gateway: 172.5.5.1
