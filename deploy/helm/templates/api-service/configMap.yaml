{{- $nameSpace := include "lowcoder.namespace" . -}}
{{- $name := include "lowcoder.fullname" . -}}
{{- $lowcoderDatabase := first .Values.mongodb.auth.databases -}}
{{- $redisSecret := lookup "v1" "Secret" $nameSpace .Values.redis.auth.existingSecret | default dict -}}
{{- $redisPassword := (index ($redisSecret.data|default dict) .Values.redis.auth.existingSecretPasswordKey | default "" | b64dec) -}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lowcoder.fullname" . }}-api-service
  labels:
    {{- include "lowcoder.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- if .Values.redis.enabled }}
  {{- if .Values.redis.auth.enabled }}
  SECALE_REDIS_URL: "redis://{{ $redisPassword }}@{{ $name }}-redis-master.{{ $nameSpace }}.svc.cluster.local:6379"
  {{- else }}
  SECALE_REDIS_URL: "redis://{{ $name }}-redis-master.{{ $nameSpace }}.svc.cluster.local:6379"
  {{- end }}
  {{- else }}
  {{- if .Values.redis.auth.enabled }}
  SECALE_REDIS_URL: "redis://{{ $redisPassword }}@{{ .Values.redis.externalUrl }}"
  {{- else }}
  SECALE_REDIS_URL: "redis://{{ .Values.redis.externalUrl }}"
  {{- end }}
  {{- end }}
  {{- if .Values.global.config.nodeServiceUrl }}
  SECALE_NODE_SERVICE_URL: {{ .Values.global.config.nodeServiceUrl | quote }}
  {{- else }}
  SECALE_NODE_SERVICE_URL: "http://{{ $name }}-node-service:{{ .Values.nodeService.service.port }}"
  {{- end }}
  SECALE_PUID: {{ .Values.global.config.userId | default "9001" | quote }}
  SECALE_PGID: {{ .Values.global.config.groupId | default "9001" | quote }}
  SECALE_CORS_DOMAINS: {{ .Values.global.config.corsAllowedDomains | default  "*" | quote }}
  SECALE_EMAIL_AUTH_ENABLED: {{ .Values.global.config.enableEmailAuth | default "true" | quote }}
  SECALE_EMAIL_SIGNUP_ENABLED: {{ .Values.global.config.enableUserSignUp | default "true" | quote }}
  SECALE_EMAIL_NOTIFICATIONS_SENDER: {{ .Values.global.config.emailNotificationSender | default "info@localhost" | quote }}
  SECALE_MAX_QUERY_TIMEOUT: {{ .Values.global.config.maxQueryTimeout | default "120" | quote }}
  SECALE_MAX_REQUEST_SIZE: {{ .Values.global.config.maxRequestSize | default "20m" | quote }}
  SECALE_MAX_ORGS_PER_USER: {{ .Values.global.defaults.maxOrgsPerUser | default "100" | quote }}
  SECALE_MAX_MEMBERS_PER_ORG: {{ .Values.global.defaults.maxMembersPerOrg | default "1000" | quote }}
  SECALE_MAX_GROUPS_PER_ORG: {{ .Values.global.defaults.maxGroupsPerOrg | default "100" | quote }}
  SECALE_MAX_APPS_PER_ORG: {{ .Values.global.defaults.maxAppsPerOrg | default "1000" | quote }}
  SECALE_MAX_DEVELOPERS: {{ .Values.global.defaults.maxDevelopers | default "50" | quote }}
  SECALE_DEFAULT_QUERY_TIMEOUT: {{ .Values.global.defaults.queryTimeout | default "10" | quote }}
  SECALE_WORKSPACE_MODE: {{ .Values.global.config.workspaceMode | default "SAAS" | quote }}
  SECALE_CREATE_WORKSPACE_ON_SIGNUP: {{ .Values.global.config.createWorkspaceOnSignup | default "true" | quote }}
  SECALE_ADMIN_SMTP_HOST: {{ .Values.global.mailServer.host | default "localhost" | quote }}
  SECALE_ADMIN_SMTP_PORT: {{ .Values.global.mailServer.port | default "578" | quote }}
  SECALE_ADMIN_SMTP_AUTH: {{ .Values.global.mailServer.smtpAuth | default "false" | quote }}
  SECALE_ADMIN_SMTP_USERNAME: {{ .Values.global.mailServer.authUsername | default "" | quote }}
  SECALE_ADMIN_SMTP_PASSWORD: {{ .Values.global.mailServer.authPassword | default "" | quote }}
  SECALE_ADMIN_SMTP_SSL_ENABLED: {{ .Values.global.mailServer.useSSL | default "false" | quote }}
  SECALE_ADMIN_SMTP_STARTTLS_ENABLED: {{ .Values.global.mailServer.useStartTLS | default "true" | quote }}
  SECALE_ADMIN_SMTP_STARTTLS_REQUIRED: {{ .Values.global.mailServer.requireStartTLS | default "true" | quote }}
  SECALE_API_RATE_LIMIT: {{ .Values.global.defaults.apiRateLimit | default "100" | quote }}
  SECALE_APP_SNAPSHOT_RETENTIONTIME: {{ .Values.global.config.snapshotRetentionTime | default "30" | quote }}
  SECALE_COOKIE_NAME: {{ .Values.global.cookie.name | default "SECALE_CE_SELFHOST_TOKEN" | quote }}
  SECALE_COOKIE_MAX_AGE: {{ .Values.global.cookie.maxAge | default "24" | quote }}
  SECALE_MARKETPLACE_PRIVATE_MODE: {{ .Values.global.config.marketplacePrivateMode | default "true" | quote }}
  SECALE_PLUGINS_DIR: {{ .Values.global.plugins.folder | default "/plugins" | quote }}
  SECALE_PUBLIC_URL: {{ .Values.global.config.publicUrl | default "https://somedomain.com/" | quote }}
